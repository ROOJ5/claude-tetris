<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <h1 class="game-title">TETRIS</h1>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section theme-toggle-section">
          <span class="label">TEMA CLARO</span>
          <label class="theme-switch">
            <input type="checkbox" id="theme-toggle" aria-label="Alternar modo claro/oscuro" />
            <span class="theme-switch-slider"></span>
          </label>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul id="controls-list">
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> / <kbd>Esc</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay">
      <div class="overlay-box">

        <div id="gameover-view">
          <p id="overlay-title">GAME OVER</p>
          <p id="overlay-score"></p>
          <div id="records-list" class="records-list"></div>
          <div id="name-entry" class="hidden">
            <input id="player-name" maxlength="12" placeholder="Tu nombre" autocomplete="off" />
            <button id="save-record-btn" class="menu-btn">Guardar</button>
          </div>
          <button id="restart-btn" class="menu-btn">Reiniciar</button>
          <button id="reset-records-btn" class="menu-btn menu-btn-secondary">Reiniciar récords</button>
        </div>

        <div id="pause-view" class="hidden">
          <p id="pause-title">PAUSA</p>

          <div id="pause-main">
            <button id="resume-btn" class="menu-btn">Reanudar</button>
            <button id="pause-restart-btn" class="menu-btn">Reiniciar</button>
            <button id="controls-btn" class="menu-btn menu-btn-secondary">Ver controles</button>

            <div class="level-select-row">
              <label for="start-level-select">Nivel inicial</label>
              <select id="start-level-select"></select>
            </div>
          </div>

          <div id="pause-controls" class="hidden controls">
            <ul id="pause-controls-list"></ul>
            <button id="controls-back-btn" class="menu-btn menu-btn-secondary">Volver</button>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
